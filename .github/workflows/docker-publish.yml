name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
      - dev                # immagine di sviluppo: ghcr.io/.../app-listino:dev
    tags:
      - "v*.*.*"           # triggers on version tags like v1.0.0
  workflow_dispatch:       # avvio manuale dalla UI di GitHub (eseguito solo su main o dev, vedi `if` del job)

# Un solo build per branch alla volta: un nuovo push annulla quello in corso
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # matte1240/app-listino

jobs:
  build-and-push:
    name: Build & Push
    # Runner self-hosted sulla VM (utente github-runner, gruppo docker).
    # Le etichette sono quelle assegnate in fase di registrazione del runner.
    runs-on: [self-hosted, vm-ubuntu]
    timeout-minutes: 30
    # Build solo per main, dev e tag di versione: le altre branch (anche con PR aperte o avvio
    # manuale) non occupano il runner. Senza trigger pull_request nemmeno le PR da fork ci arrivano.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write       # needed to push to GHCR

    steps:
      # 1. Checkout code (clean: true evita residui della build precedente sul runner persistente)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # 2. Setup Docker Buildx (multi-platform support + cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags + labels) from Git context
      #    branch main  → ghcr.io/matte1240/app-listino:main + :latest
      #    branch dev   → ghcr.io/matte1240/app-listino:dev + :dev-<sha>
      #    tag v1.2.3   → ghcr.io/matte1240/app-listino:1.2.3 + :1.2
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}

      # 5. Build and push
      #    Layer cache stored in GitHub Actions cache to speed up future builds
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # 6. Print image digest for traceability
      - name: Image digest
        run: echo "Published ${{ steps.meta.outputs.tags }}"

      # 7. Pulizia disco: la VM ha poco spazio, la cache locale di buildx e le immagini
      #    penzolanti vanno rimosse a ogni run (la cache "vera" è quella di GitHub Actions).
      - name: Clean up Docker build cache
        if: always()
        run: |
          docker builder prune --all --force >/dev/null 2>&1 || true
          docker image prune --force >/dev/null 2>&1 || true
          df -h / | tail -1

  # Deploy automatico dell'ambiente dev sulla stessa VM del runner.
  # Si attiva solo se in Settings → Secrets and variables → Actions → Variables esiste
  # DEV_COMPOSE_DIR = cartella sulla VM (leggibile dall'utente github-runner) che contiene
  # docker-compose.dev.yml e .env.dev. Senza la variabile il job viene saltato.
  deploy-dev:
    name: Deploy dev
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && vars.DEV_COMPOSE_DIR != ''
    runs-on: [self-hosted, vm-ubuntu]
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & restart dev container
        working-directory: ${{ vars.DEV_COMPOSE_DIR }}
        run: |
          docker compose -f docker-compose.dev.yml pull
          docker compose -f docker-compose.dev.yml up -d --remove-orphans
          docker image prune --force >/dev/null 2>&1 || true
          docker compose -f docker-compose.dev.yml ps
